<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>New Releases - Tudor Comics</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1729;
  --surface: #1a2332;
  --card: #243044;
  --accent: #3b82f6;
  --marvel: #e02424;
  --dc: #0074e0;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --success: #22c55e;
  --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}
.header {
  background: var(--surface);
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.header h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
.header .back { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
.section-title {
  padding: 16px 20px 8px;
  font-size: 1rem;
  font-weight: 600;
  color: var(--muted);
}
.releases-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  padding: 8px 20px;
}
.release-card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.release-card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
}
.release-card-info { padding: 10px; }
.release-card-title { font-size: 0.8rem; font-weight: 600; line-height: 1.2; margin-bottom: 4px; }
.release-card-date { font-size: 0.7rem; color: var(--muted); }
.owned-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--success);
  color: white;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.65rem;
  font-weight: 700;
}
.add-btn {
  display: block;
  width: 100%;
  padding: 8px;
  background: var(--accent);
  color: white;
  border: none;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
}
.add-btn:active { opacity: 0.7; }
.empty-msg {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.empty-msg p { margin-bottom: 10px; }
.tracked-list {
  padding: 0 20px 20px;
}
.tracked-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: var(--card);
  border-radius: 8px;
  margin-bottom: 8px;
}
.tracked-item img { width: 36px; height: 54px; object-fit: cover; border-radius: 4px; }
.tracked-item-name { flex: 1; font-size: 0.85rem; }
.tracked-item-unsub {
  background: none;
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--muted);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.7rem;
  cursor: pointer;
}
.loading { text-align: center; padding: 40px; color: var(--muted); }
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 0.85rem;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back">&larr; Collection</a>
  <h1>&#x1F195; New Releases</h1>
</div>

<div id="content">
  <div class="loading">Loading...</div>
</div>

<div class="section-title" style="margin-top:20px">Tracked Series</div>
<div class="tracked-list" id="tracked-list"></div>

<div class="toast" id="toast"></div>

<script>
const WORKER = 'https://comics-proxy.cristian-marinescu.workers.dev';
let comics = [];
let trackedSeries = [];

async function init() {
  try {
    const [cr, sr] = await Promise.all([
      fetch('comics.json?_=' + Date.now()),
      fetch('tracked-series.json?_=' + Date.now())
    ]);
    comics = await cr.json();
    trackedSeries = await sr.json();
  } catch (e) {
    comics = JSON.parse(localStorage.getItem('comics') || '[]');
    trackedSeries = JSON.parse(localStorage.getItem('tracked-series') || '[]');
  }

  renderTrackedList();

  if (trackedSeries.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty-msg">
        <p>You're not tracking any series yet.</p>
        <p>Add a comic to your collection and check "Track this series".</p>
      </div>`;
    return;
  }

  await loadReleases();
}

async function loadReleases() {
  if (!WORKER) {
    document.getElementById('content').innerHTML = '<div class="empty-msg"><p>Worker URL not configured</p></div>';
    return;
  }

  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay() + 1);
  const endOfNextWeek = new Date(startOfWeek);
  endOfNextWeek.setDate(startOfWeek.getDate() + 13);

  const cacheKey = 'releases_' + startOfWeek.toISOString().split('T')[0];
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    const { data, ts } = JSON.parse(cached);
    if (Date.now() - ts < 4 * 3600 * 1000) {
      renderReleases(data);
      return;
    }
  }

  let allIssues = [];
  for (const series of trackedSeries) {
    try {
      const id = series.id.replace('4050-', '');
      const resp = await fetch(`${WORKER}/issues?volume=${id}`);
      const data = await resp.json();
      if (data.results) {
        allIssues.push(...data.results.map(r => ({
          id: '4000-' + r.id,
          title: `${series.name} #${r.issue_number}`,
          series: series.name,
          series_id: series.id,
          issue_number: r.issue_number,
          cover_url: r.image?.medium_url || '',
          release_date: r.store_date || r.cover_date || '',
          publisher: series.publisher,
        })));
      }
    } catch (e) { /* skip failed series */ }
  }

  localStorage.setItem(cacheKey, JSON.stringify({ data: allIssues, ts: Date.now() }));
  renderReleases(allIssues);
}

function renderReleases(issues) {
  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay() + 1);
  const endOfWeek = new Date(startOfWeek);
  endOfWeek.setDate(startOfWeek.getDate() + 6);
  const startNextWeek = new Date(endOfWeek);
  startNextWeek.setDate(endOfWeek.getDate() + 1);
  const endNextWeek = new Date(startNextWeek);
  endNextWeek.setDate(startNextWeek.getDate() + 6);

  const fmt = d => d.toISOString().split('T')[0];
  const thisWeek = issues.filter(i => i.release_date >= fmt(startOfWeek) && i.release_date <= fmt(endOfWeek));
  const nextWeek = issues.filter(i => i.release_date >= fmt(startNextWeek) && i.release_date <= fmt(endNextWeek));

  let html = '';
  if (thisWeek.length > 0) {
    html += `<div class="section-title">This Week (${fmt(startOfWeek)} - ${fmt(endOfWeek)})</div>`;
    html += '<div class="releases-grid">' + thisWeek.map(renderReleaseCard).join('') + '</div>';
  }
  if (nextWeek.length > 0) {
    html += `<div class="section-title">Next Week (${fmt(startNextWeek)} - ${fmt(endNextWeek)})</div>`;
    html += '<div class="releases-grid">' + nextWeek.map(renderReleaseCard).join('') + '</div>';
  }
  if (thisWeek.length === 0 && nextWeek.length === 0) {
    html = '<div class="empty-msg"><p>No new releases in the next 2 weeks.</p></div>';
  }
  document.getElementById('content').innerHTML = html;
}

function renderReleaseCard(issue) {
  const owned = comics.some(c => c.id === issue.id);
  return `
    <div class="release-card">
      <img src="${issue.cover_url}" alt="${issue.title}" loading="lazy">
      ${owned ? '<div class="owned-badge">Owned!</div>' : ''}
      <div class="release-card-info">
        <div class="release-card-title">${issue.title}</div>
        <div class="release-card-date">${issue.release_date}</div>
      </div>
      ${!owned ? `<button class="add-btn" onclick="quickAdd(${JSON.stringify(issue).replace(/"/g, '&quot;')})">+ Add</button>` : ''}
    </div>`;
}

async function quickAdd(issue) {
  issue.added_date = new Date().toISOString().split('T')[0];
  issue.location = '';
  issue.condition = 'mint';
  issue.notes = '';
  issue.read = false;
  comics.push(issue);
  localStorage.setItem('comics', JSON.stringify(comics));
  showToast('Added to collection!');

  if (WORKER) {
    await fetch(WORKER + '/collection/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(issue),
    });
  }

  const cached = localStorage.getItem('releases_' + new Date().toISOString().split('T')[0].slice(0, 10));
  if (cached) {
    const { data } = JSON.parse(cached);
    renderReleases(data);
  }
}

function renderTrackedList() {
  if (trackedSeries.length === 0) {
    document.getElementById('tracked-list').innerHTML = '<div style="color:var(--muted);font-size:0.85rem">No tracked series</div>';
    return;
  }
  document.getElementById('tracked-list').innerHTML = trackedSeries.map(s => `
    <div class="tracked-item">
      <img src="${s.image_url || ''}" alt="">
      <div class="tracked-item-name">${s.name} <span style="color:var(--muted);font-size:0.75rem">${s.publisher || ''}</span></div>
      <button class="tracked-item-unsub" onclick="untrack('${s.id}')">Untrack</button>
    </div>`).join('');
}

async function untrack(id) {
  trackedSeries = trackedSeries.filter(s => s.id !== id);
  localStorage.setItem('tracked-series', JSON.stringify(trackedSeries));
  renderTrackedList();
  showToast('Series untracked');
  if (WORKER) {
    await fetch(WORKER + '/series/untrack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
